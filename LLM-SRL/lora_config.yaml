model_name_or_path: /path/to/your/model

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
flash_attn: sdpa

### correction arguments
correct_step: 100000
pred_correct: true
argument_correct: true

### dataset
dataset: /path/to/your/dataset
template: llama3
cutoff_len: 3072
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: output/conll12_en_lora
report_to: wandb
run_name: conll12_en_lora
logging_steps: 100
save_strategy: steps
save_steps: 20000
max_steps: 200000
save_total_limit: 2
plot_loss: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.05
max_grad_norm: 1.0
warmup_steps: 100
seed: 42
fp16: true
